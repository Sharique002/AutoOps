# ==============================================================================
# AutoOps Application Monitoring Configuration for Nagios Core
# ==============================================================================

# Host Definition: autoops-app
define host {
    use                     linux-server
    host_name               autoops-app
    alias                   AutoOps FastAPI Application Microservice
    address                 autoops-app
    max_check_attempts      2
    check_interval          2
    retry_interval          1
    check_period            24x7
    check_command           check_http!-p 5000 -u /health -e "HTTP/1.1 200" -s "healthy"
    notification_interval   60
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          admins
}

# Service Definition: Application HTTP Health Contract Probe
define service {
    use                     generic-service
    host_name               autoops-app
    service_description     AutoOps_Microservice_Health
    check_command           check_http!-p 5000 -u /health -e "HTTP/1.1 200" -s "healthy"
    max_check_attempts      2
    check_interval          2
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}

# Service Definition: Application Root Endpoint Probe
define service {
    use                     generic-service
    host_name               autoops-app
    service_description     AutoOps_Microservice_Root
    check_command           check_http!-p 5000 -u / -e "HTTP/1.1 200" -s "AutoOps Platform"
    max_check_attempts      2
    check_interval          2
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}

# Service Definition: Container TCP Port 5000 Listener Probe
define service {
    use                     generic-service
    host_name               autoops-app
    service_description     AutoOps_Microservice_Port_5000
    check_command           check_tcp!5000
    max_check_attempts      2
    check_interval          2
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}
