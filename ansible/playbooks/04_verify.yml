---
- name: AutoOps End-to-End Post-Deployment Verification & Architecture Audit
  hosts: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    policy_file: "/etc/autoops/autoops_policy.conf"

  tasks:
    - name: 1. Verify Docker Compose application container is running and healthy
      ansible.builtin.command: >
        docker inspect --format {% raw %}'{{.State.Status}}:{{.State.Health.Status}}'{% endraw %} autoops-app
      register: compose_app_inspect
      changed_when: false
      failed_when: compose_app_inspect.stdout != "running:healthy"

    - name: 2. Verify Docker Compose application network exists
      ansible.builtin.command: >
        docker network inspect autoops-network --format {% raw %}'{{range .IPAM.Config}}{{.Subnet}}{{end}}'{% endraw %}
      register: compose_net_inspect
      changed_when: false
      failed_when: "'172.18.0.0/16' not in compose_net_inspect.stdout"

    - name: 3. Verify Terraform infrastructure network exists
      ansible.builtin.command: >
        docker network inspect autoops-infra-net --format {% raw %}'{{range .IPAM.Config}}{{.Subnet}}{{end}}'{% endraw %}
      register: tf_net_inspect
      changed_when: false
      failed_when: "'172.28.0.0/16' not in tf_net_inspect.stdout"

    - name: 4. Verify Terraform auxiliary data volume exists
      ansible.builtin.command: >
        docker volume inspect autoops-data-storage --format {% raw %}'{{.Name}}'{% endraw %}
      register: tf_vol_inspect
      changed_when: false
      failed_when: tf_vol_inspect.stdout != "autoops-data-storage"

    - name: 5. Verify Terraform state idempotency (zero drift check)
      ansible.builtin.command:
        cmd: terraform plan -detailed-exitcode -no-color
        chdir: "{{ repo_root }}/terraform"
      register: tf_plan_result
      changed_when: false
      failed_when: tf_plan_result.rc != 0

    - name: 6. Verify Puppet policy configuration file contents
      ansible.builtin.slurp:
        src: "{{ policy_file }}"
      register: policy_slurp

    - name: 7. Validate Puppet policy configuration parameters
      vars:
        policy_text: "{{ policy_slurp.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'app_port = 5000' in policy_text"
          - "'nagios_port = 8080' in policy_text"
          - "'health_endpoint = /health' in policy_text"
          - "'compose_managed = autoops-app,autoops-network' in policy_text"
          - "'terraform_managed = autoops-infra-net,autoops-data-storage,autoops-infra-sandbox' in policy_text"
        fail_msg: "Policy file content does not match expected architectural contract."
        success_msg: "Puppet policy file adheres to architectural contract."

    - name: Display consolidated verification audit
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "       AUTOOPS ARCHITECTURE AUDIT & VERIFICATION          "
          - "=========================================================="
          - "Application Container: autoops-app (running:healthy)"
          - "Compose Network:       autoops-network (172.18.0.0/16)"
          - "Terraform Network:     autoops-infra-net (172.28.0.0/16)"
          - "Terraform Volume:      autoops-data-storage (EXISTS)"
          - "Terraform State Drift: 0 changes detected (PLAN EXIT CODE 0)"
          - "Puppet Policy Config:  /etc/autoops/autoops_policy.conf (VALIDATED)"
          - "=========================================================="
          - "Result: PASS - All component boundaries strictly respected"
