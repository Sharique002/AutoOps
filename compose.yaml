services:
  autoops-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoops-app:latest
    container_name: autoops-app
    ports:
      - "5000:5000"
    networks:
      - autoops-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  autoops-nagios:
    image: jasonrivers/nagios:latest
    container_name: autoops-nagios
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - autoops-network
    depends_on:
      autoops-app:
        condition: service_healthy
    environment:
      - NAGIOSADMIN_USER=${NAGIOSADMIN_USER:-nagiosadmin}
      - NAGIOSADMIN_PASS=${NAGIOSADMIN_PASS:-ChangeMeToAStrongPassword123!}
      - NAGIOS_TIMEZONE=${NAGIOS_TIMEZONE:-UTC}
    volumes:
      - ./nagios/nagios.cfg:/opt/nagios/etc/nagios.cfg:ro
      - ./nagios/conf.d:/opt/nagios/etc/conf.d:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -u \"$${NAGIOSADMIN_USER:-nagiosadmin}:$${NAGIOSADMIN_PASS:-ChangeMeToAStrongPassword123!}\" http://127.0.0.1/nagios/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  autoops-network:
    name: autoops-network
    driver: bridge
